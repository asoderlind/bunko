# Development compose for bunko.
#
# Ollama is NOT a service here: the model runs on another machine or locally.
# Point OLLAMA_BASE_URL at it in .env.
#
# Usage:
#   cp .env.example .env   # then edit
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Ports bind to the address in BIND_HOST.

name: bunko

services:
  web:
    # Run as the host uid so bind-mounted source files aren't left root-owned.
    user: "${UID:-1000}:${GID:-1000}"
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      sh -c "python -m app.cli init-db &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/bunko.sqlite3}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      TAGGING_POLL_SECONDS: ${TAGGING_POLL_SECONDS:-2}
    volumes:
      # Database and note images survive container rebuilds.
      - ./data:/data
      # Bind-mount source so reload picks up backend edits without a rebuild.
      - ./backend:/app
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    # Vite dev server with HMR.
    image: node:22-slim
    working_dir: /fe
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    command: >
      sh -c "corepack pnpm install --frozen-lockfile &&
             corepack pnpm exec svelte-kit sync &&
             corepack pnpm dev"
    environment:
      HOME: /tmp
      COREPACK_HOME: /tmp/corepack
      VITE_API_PROXY: http://web:8000
    volumes:
      - ./frontend:/fe
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - web
