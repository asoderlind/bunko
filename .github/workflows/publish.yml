name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test release tooling
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Validate tag against changelog
        if: github.ref_type == 'tag'
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME"

  test:
    name: Backend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SECRET_KEY: ci-test-key-that-is-definitely-longer-than-32-chars
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q

  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    needs: [validate, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Image names must be lowercase. The app is bunko even though the repo
      # may still be named easy-notes.
      - name: Normalize image name
        id: image
        run: |
          name="${{ env.REGISTRY }}/${{ github.repository_owner }}/bunko"
          echo "name=${name,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Dell is x86_64; always publish the production image for amd64,
          # even when development happens on the ARM64 Raspberry Pi.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  release:
    name: Create release after publishing
    needs: publish
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
